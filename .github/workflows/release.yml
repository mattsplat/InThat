# Builds a signed release APK and Play Store bundle.
#
# Push a version tag to publish a GitHub Release:   git tag v1.0.0 && git push origin v1.0.0
# Or run it by hand from the Actions tab to just get the files as a download.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64   the .jks file, base64-encoded
#   SIGNING_STORE_PASSWORD    keystore password
#   SIGNING_KEY_ALIAS         key alias inside the keystore
#   SIGNING_KEY_PASSWORD      key password (often the same as the keystore password)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out the version
        id: version
        run: |
          # v1.2.3 -> 1.2.3; manual runs without a tag get a dev version
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" ]]; then echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest assembleRelease bundleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.version.outputs.name }}

      - name: Check the APK is signed
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HomePrice-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/HomePrice-${{ steps.version.outputs.name }}.aab"

      - name: Upload as a workflow download
        uses: actions/upload-artifact@v7
        with:
          name: HomePrice-${{ steps.version.outputs.name }}
          path: dist/

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
